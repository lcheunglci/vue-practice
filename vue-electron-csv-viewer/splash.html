<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; height: 100vh; background: #1e1e2e; display: flex; align-items: center; justify-content: center; font-family: ui-sans-serif, system-ui, sans-serif; color: #fff; }
  .spin { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #5b6eff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { margin-top: 18px; font-size: 14px; letter-spacing: 0.05em; color: #ccc; }
</style>
</head>
<body>
  <div style="text-align:center">
    <div class="spin"></div>
    <div class="label">Reports Insight</div>
  </div>
</body>
</html>
